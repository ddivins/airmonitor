name: tests

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Compile package
        run: python -m compileall -q src
      - name: Import checks
        run: |
          python - <<'PY'
          from airmonitor.sensors.sgx.ps1_voc import parse_combined_response
          from airmonitor.sensors.sgx_ps1_voc_1000 import parse_combined_response as legacy_parse
          from airmonitor.printers.bambu import PrinterStateCache
          from airmonitor.filters.bento import BentoFilter
          from airmonitor.filters.levoit import LevoitFilter
          assert parse_combined_response is legacy_parse
          print("umbrella imports: OK")
          PY
      - name: Tests
        run: pytest -q
