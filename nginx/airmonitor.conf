server {
    listen 80;
    listen [::]:80;
    server_name airmonitor.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name airmonitor.example.com;

    ssl_certificate /etc/letsencrypt/live/airmonitor.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/airmonitor.example.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = / {
        error_page 418 = @grafana-root;
        if ($cookie_grafana_session != "") {
            return 418;
        }
        proxy_pass http://127.0.0.1:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_intercept_errors on;
        error_page 502 503 504 =503 /airmonitor-offline.html;
    }

    location = /status-api {
        proxy_pass http://127.0.0.1:8080/api/status;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-store" always;
    }

    location = /status-healthz {
        proxy_pass http://127.0.0.1:8080/healthz;
    }

    location /status-assets/ {
        proxy_pass http://127.0.0.1:8080/assets/;
    }

    location = /airmonitor-offline.html {
        internal;
        root /var/www/airmonitor;
    }

    # Start with a clean Grafana session so anonymous access cannot bypass the
    # login form, then preserve a signed-in destination that is not the landing
    # page reserved at `/` above.
    location = /grafana-signin {
        proxy_pass http://127.0.0.1:3000/logout;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Grafana returns `/` after a successful password login. Signed-in requests
    # carry its session cookie and reach this named location from the exact `/`
    # route above; anonymous requests continue to see the appliance page.
    location @grafana-root {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
