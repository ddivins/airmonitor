server {
    listen 80;
    listen [::]:80;
    server_name airmonitor.example.com grafana.airmonitor.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name airmonitor.example.com;

    ssl_certificate /etc/letsencrypt/live/airmonitor.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/airmonitor.example.com/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = / {
        proxy_pass http://127.0.0.1:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_intercept_errors on;
        error_page 502 503 504 =503 /airmonitor-offline.html;
    }

    location = /status {
        return 302 /;
    }

    location = /status-api {
        proxy_pass http://127.0.0.1:8080/api/status;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-store" always;
    }

    location = /session-api {
        proxy_pass http://127.0.0.1:8080/api/session;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-store" always;
    }

    location = /service-control-api {
        proxy_pass http://127.0.0.1:8080/api/services/control;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-store" always;
    }

    location = /filter-control-api {
        proxy_pass http://127.0.0.1:8080/api/filters/control;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-store" always;
    }

    location = /service-status-api {
        proxy_pass http://127.0.0.1:8080/api/services/status;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Cache-Control "no-store" always;
    }

    location = /status-healthz {
        proxy_pass http://127.0.0.1:8080/healthz;
    }

    location /status-assets/ {
        proxy_pass http://127.0.0.1:8080/assets/;
    }

    location = /airmonitor-offline.html {
        internal;
        root /var/www/airmonitor;
    }

    location = /grafana {
        return 301 /grafana/;
    }

    # Grafana confines redirectTo values to its configured subpath. Rewrite the
    # successful password-login JSON response so the unified app returns to
    # the signed-in appliance landing page instead of Grafana home.
    location = /grafana/login {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Accept-Encoding "";
        proxy_cookie_path /grafana "/; Secure; HttpOnly; SameSite=Lax";
        proxy_cookie_path / "/; Secure; HttpOnly; SameSite=Lax";
        sub_filter_types application/json;
        sub_filter_once off;
        sub_filter '"redirectUrl":"/grafana/"' '"redirectUrl":"/"';
        sub_filter '"redirectUrl":"/grafana"' '"redirectUrl":"/"';
    }

    location /grafana/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # Grafana is still the session authority. Widen its subpath cookie to
        # the appliance root so /session-api can validate the same login.
        proxy_cookie_path /grafana "/; Secure; HttpOnly; SameSite=Lax";
        proxy_cookie_path / "/; Secure; HttpOnly; SameSite=Lax";
    }

    # Preserve historical same-host Grafana bookmarks beneath the new subpath.
    location / {
        return 301 /grafana$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name grafana.airmonitor.example.com;

    ssl_certificate /etc/letsencrypt/live/grafana.airmonitor.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grafana.airmonitor.example.com/privkey.pem;

    # Compatibility host: old bookmarks move permanently into the unified app.
    location / {
        return 301 https://airmonitor.example.com/grafana$request_uri;
    }
}
