[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "airmonitor"
version = "0.5.0"
description = "Raspberry Pi air-quality monitoring and printer filter automation appliance"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyserial>=3.5,<4",
    "paho-mqtt>=2,<3",
    "PyYAML>=6,<7",
    "python-kasa>=0.10,<1",
    "pyvesync>=2,<3",
]

[project.scripts]
airmonitor = "airmonitor.cli:main"
airmonitor-doctor = "airmonitor.health:main"
airmonitor-hardware = "airmonitor.hardware:main"
airmonitor-hardware-auto = "airmonitor.hardware_auto:main"
airmonitor-inventory = "airmonitor.inventory:main"
airmonitor-sensor-service = "airmonitor.sensor_service:main"
airmonitor-sps30 = "airmonitor.sps30_service:main"
airmonitor-printer-mqtt = "airmonitor.cli:run_printer_mqtt_service"
airmonitor-bento = "airmonitor.cli:run_bento_service"
airmonitor-levoit = "airmonitor.cli:run_levoit_service"
airmonitor-levoit-service = "airmonitor.filters.levoit.supervisor:main"
airmonitor-status = "airmonitor.status_web:main"

[tool.hatch.build.targets.wheel]
packages = ["src/airmonitor"]
