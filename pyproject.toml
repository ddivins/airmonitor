[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "airmonitor"
version = "0.3.0"
description = "Raspberry Pi air-quality monitoring with pluggable sensor drivers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyserial>=3.5,<4",
    "paho-mqtt>=2,<3",
]

[project.scripts]
airmonitor = "airmonitor.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/airmonitor"]
