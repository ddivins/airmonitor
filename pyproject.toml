[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "airmonitor"
version = "0.6.0"
description = "Raspberry Pi air-quality monitoring and printer filter automation appliance"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8,<4",
    "openpyxl>=3.1,<4",
    "pyserial>=3.5,<4",
    "paho-mqtt>=2,<3",
    "PyYAML>=6,<7",
    "python-kasa>=0.10,<1",
    "pyvesync>=2,<3",
    "reportlab>=4,<5",
]

[project.scripts]
airmonitor = "airmonitor.cli:main"
airmonitor-doctor = "airmonitor.health:main"
airmonitor-hardware = "airmonitor.hardware:main"
airmonitor-hardware-auto = "airmonitor.hardware_auto:main"
airmonitor-inventory = "airmonitor.inventory:main"
airmonitor-sensor-service = "airmonitor.sensor_service:main"
airmonitor-sps30 = "airmonitor.sps30_service:main"
airmonitor-printer-mqtt = "airmonitor.cli:run_printer_mqtt_service"
airmonitor-bento = "airmonitor.cli:run_bento_service"
airmonitor-levoit = "airmonitor.cli:run_levoit_service"
airmonitor-levoit-service = "airmonitor.filters.levoit.supervisor:main"
airmonitor-status = "airmonitor.status_web:main"
airmonitor-export = "airmonitor.exports.web:main"
airmonitor-alerts = "airmonitor.alerts.service:main"
airmonitor-setup = "airmonitor.setup_wizard:main"

[tool.hatch.build.targets.wheel]
packages = ["src/airmonitor"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Intentionally the same as ruff's built-in defaults (pyflakes + basic
# pycodestyle correctness checks), pinned explicitly so a future ruff release
# changing its defaults doesn't silently change what CI enforces. The
# existing codebase favors long lines and mixed import ordering over strict
# formatting, so E501/I/UP/B are deliberately not enabled yet -- expand this
# selection in a dedicated pass rather than mixing a style rewrite into
# unrelated changes.
select = ["E4", "E7", "E9", "F"]
