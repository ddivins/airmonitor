[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "airmonitor"
version = "0.5.0"
description = "Raspberry Pi air-quality monitoring and printer filter automation appliance"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyserial>=3.5,<4",
    "paho-mqtt>=2,<3",
    "PyYAML>=6,<7",
    "python-kasa>=0.10,<1",
    "pyvesync>=2,<3",
]

[project.scripts]
airmonitor = "airmonitor.cli:main"
airmonitor-doctor = "airmonitor.health:main"
airmonitor-printer-mqtt = "airmonitor.cli:run_printer_mqtt_service"
bambu-bento = "airmonitor.cli:run_bento_service"
levoit-filter = "airmonitor.cli:run_levoit_service"

[tool.hatch.build.targets.wheel]
packages = ["src/airmonitor"]
